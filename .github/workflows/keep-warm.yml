# Render 미리보기 깨우기. 무료 등급은 15분 동안 요청이 없으면 잠들어 다음 접속에 1분 가까이 걸린다.
# GitHub 예약 실행(schedule)은 수십 분씩 늦거나 건너뛰는 일이 잦아 10분 간격 예약만으로는 잠든다.
# 그래서 한 번 실행되면 약 5시간 50분 동안 5분마다 상태 확인 주소(/api/v1/health)를 부르고,
# 끝날 때 자기 자신을 다시 실행해 끊기지 않게 한다. 예약 실행은 이 고리가 끊겼을 때 다시 잇는 예비다.
# 동시에 하나만 돌고, 뒤에 온 실행은 앞 실행이 끝날 때까지 기다린다. Render 설정은 건드리지 않는다.
# 예약 실행은 main 에 있을 때만 돈다. 공개 저장소라 Actions 비용은 없다.
name: Render 깨우기

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # 끝날 때 자기 자신을 다시 실행한다.
  actions: write

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    name: 미리보기 주소 부르기
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 5분마다 상태 확인 요청
        # 잠들어 있었다면 깨어나는 데 1분 남짓 걸리니 넉넉히 기다린다. 한 번 실패해도 다음 차례에 다시 부른다.
        run: |
          end=$((SECONDS + 350 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            curl --silent --show-error --max-time 180 \
              -o /dev/null -w "$(date -u +%H:%M) HTTP %{http_code}, %{time_total}초\n" \
              https://connect-link-xmwv.onrender.com/api/v1/health || echo "$(date -u +%H:%M) 요청 실패"
            sleep 300
          done

      - name: 다음 실행 이어 붙이기
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-warm.yml --repo "$GITHUB_REPOSITORY" --ref main
