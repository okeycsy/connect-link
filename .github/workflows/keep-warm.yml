# Render 미리보기 깨우기. 무료 등급은 15분 동안 요청이 없으면 잠들어 다음 접속에 1분 가까이 걸린다.
# 10분마다 상태 확인 주소(/api/v1/health)를 한 번 불러 잠들지 않게 한다. Render 설정은 건드리지 않는다.
# 예약 실행(schedule)은 main 에 있을 때만 돈다. 공개 저장소라 Actions 비용은 없다.
name: Render 깨우기

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    name: 미리보기 주소 부르기
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 상태 확인 요청
        # 잠들어 있었다면 깨어나는 데 1분 남짓 걸리니 넉넉히 기다린다. 실패해도 다음 실행에서 다시 부른다.
        run: |
          curl --silent --show-error --fail --max-time 180 --retry 2 --retry-delay 10 \
            -o /dev/null -w "HTTP %{http_code}, %{time_total}초\n" \
            https://connect-link-xmwv.onrender.com/api/v1/health
