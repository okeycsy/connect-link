<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연결고리</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
           background: #f6f7f9; color: #1d1f23; padding: 16px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e8eaed; } }
    main { text-align: center; max-width: 480px; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { opacity: .7; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>연결고리</h1>
    <p>어느 기기에서 열어도 같은 페이지가 보이면 세팅 완료입니다.</p>
    <p id="updated"></p>
  </main>
  <script>
    document.getElementById('updated').textContent = '마지막 배포: 2026-10-11';
  </script>
</body>
</html>
