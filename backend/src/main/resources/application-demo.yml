# 내부망 시연용 기본 프로필. 샘플 데이터를 넣고 화면과 API를 한 포트에서 제공한다.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  organization:
    # 결제원 대표 국번(가상). 참가기관 담당자에게 결제원 내선 1101 이 02-000-1101 로 보인다.
    kftc-office-phone-prefix: "02-000-"
  support:
    # 샘플 문의 주소(가상).
    inquiry-email: help@connect-link.example.com
  network:
    # 시연·개발·테스트는 내부망이 기본이고, 화면의 망 전환 토글(X-Network-Zone 헤더)을 믿는다.
    header-override: true
    default-zone: INTERNAL
  demo:
    # 데모 계정 공통 비밀번호. db/seed/R__2_account_seed.sql 의 해시와 README 의 데모 계정 표와 같아야 한다.
    account-password: demo1234!
    # 발송함(데모 도구 메뉴)을 관리자가 아닌 계정도 본다. 데모 메뉴는 모든 계정에 보이고 메일은 전부 가상 데이터다. 운영은 꺼져 있어 관리자만 본다.
    outbox-open-to-all: true
    # 샘플 데이터를 오늘 기준으로 다시 넣는 때(매일 4시). 시드의 기한·일정은 넣는 날 기준이라 서버가 오래 켜져 있으면 다 지난 날짜가 된다.
    # 다시 넣으면 시연 중 만든 데이터와 로그인이 사라진다.
    sample-refresh-cron: "0 0 4 * * *"
