spring:
  profiles:
    # app.jar 를 그냥 실행하면 내부망 시연용 demo 프로필로 뜬다.
    default: demo
  application:
    name: connect-link
  datasource:
    url: jdbc:h2:mem:connectlink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
  mvc:
    format:
      date: iso
      date-time: iso
  servlet:
    multipart:
      # app.attachment.max-size 와 같게 둔다. 넘으면 413 FILE_TOO_LARGE.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  # Render 같은 호스팅은 PORT 환경변수로 포트를 준다.
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  network:
    # 운영: 내부 IP 대역을 적는다(예: 10.0.0.0/8). 대역 밖과 헤더는 인터넷망.
    internal-cidrs: []
    header-override: false
    default-zone: EXTERNAL
  account:
    verification:
      # 회사 이메일 인증. 명세에 없어 기본값을 두었다(docs/decisions.md).
      code-ttl: 10m
      max-attempts: 5
      resend-interval: 60s
      token-ttl: 30m
  attachment:
    # 프로토타입 저장소(임시 디렉터리). 운영은 공유 스토리지 경로나 다른 FileStorage 구현으로 바꾼다.
    dir: ${java.io.tmpdir}/connect-link-files
    max-size: 20MB
  suspension:
    # 끝난 확정 일시중단을 완료로 바꾸는 주기(ms).
    completion-interval: 60000
    digest:
      # 전 영업일 취합. 전달 양식은 명세 미결이라 임시 양식이다(SuspensionDigestFormatter 빈을 바꿔 끼운다).
      cron: "0 0 17 * * MON-FRI"
      channels: ["~kftc-ops", "~kftc-control-room"]
      # 주말 말고 쉬는 날(예: 2026-12-25). 영업일 계산에 쓴다.
      holidays: []

logging:
  level:
    com.connectlink: INFO
