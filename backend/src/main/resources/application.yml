spring:
  profiles:
    # app.jar 를 그냥 실행하면 내부망 시연용 demo 프로필로 뜬다.
    default: demo
  application:
    name: connect-link
  datasource:
    url: jdbc:h2:mem:connectlink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
    placeholders:
      # 샘플 데이터(db/seed)의 메일 본문 링크가 실제 발송 메일과 같은 주소를 쓰게 한다.
      site_url: ${app.notification.site-url}
  jackson:
    time-zone: Asia/Seoul
  mvc:
    format:
      date: iso
      date-time: iso
  servlet:
    multipart:
      # app.attachment.max-size 와 같게 둔다. 넘으면 413 FILE_TOO_LARGE.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  # Render 같은 호스팅은 PORT 환경변수로 포트를 준다.
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  network:
    # 운영: 내부 IP 대역을 적는다(예: 10.0.0.0/8). 대역 밖과 헤더는 인터넷망.
    internal-cidrs: []
    header-override: false
    default-zone: EXTERNAL
  support:
    # 로그인 화면 "문의 메일 보내기" 주소. 공개 저장소라 실제 주소는 배포 설정(환경 변수 APP_SUPPORT_INQUIRY_EMAIL)으로 넣는다. 비우면 문의하기 칸이 빠진다.
    inquiry-email: ""
  account:
    verification:
      # 회사 이메일 인증. 명세에 없어 기본값을 두었다(docs/decisions.md).
      code-ttl: 10m
      max-attempts: 5
      resend-interval: 60s
      token-ttl: 30m
  notification:
    # 메일 본문에 넣는 연결이 주소. 공개 저장소라 실제 주소는 배포 설정(환경 변수 APP_NOTIFICATION_SITE_URL)으로 넣는다.
    site-url: http://localhost:8080
    delivery:
      # 발송함의 실제 발송(메일, 매터모스트 팀 채널). 꺼 두면(기본, demo) 발송함에 기록만 한다. 켜려면 spring.mail.host 등 메일 서버 설정과
      # 아래 주소들을 배포 설정(환경 변수)으로 넣는다. 공개 저장소라 실제 값은 여기에 적지 않는다.
      enabled: false
      # 밀리초다(@Scheduled 가 Spring 5 에서 30s 같은 표기를 읽지 못한다).
      interval: 30000
      batch-size: 50
      max-attempts: 3
      mail:
        # 보내는 사람 주소. 비우면 메일은 보내지 않고 발송 대기로 둔다.
        from: ""
      mattermost:
        # Incoming Webhook 주소(환경 변수 APP_NOTIFICATION_DELIVERY_MATTERMOST_WEBHOOK_URL). 비우면 보내지 않고 발송 대기로 둔다.
        # 팀 채널(~채널) 글만 보내고 채널 이름을 글에 실어 보내므로 웹훅을 한 채널에 고정하지 않는다. 개인 앞(@) 글은 기록만 남는다.
        webhook-url: ""
        username: 연결이
  attachment:
    # 프로토타입 저장소(임시 디렉터리). 운영은 공유 스토리지 경로나 다른 FileStorage 구현으로 바꾼다.
    dir: ${java.io.tmpdir}/connect-link-files
    max-size: 20MB
  contact:
    # 최근 확인일 6개월이 지난 담당자에게 확인 요청 알림을 보내는 때(매일 9시).
    reconfirm-cron: "0 0 9 * * *"
    campaign:
      # 정기 변경(현행화) 주기. 업무의 최근 주간 시작일에서 cycle-months 가 지나면 duration-days 짜리 주간을 스스로 등록해 변경 요청 메일을 보낸다.
      auto-create: true
      cycle-months: 6
      duration-days: 14
      # 현행화 완료를 누르지 않은 기관에 요청 메일이나 앞 리마인드에서 이만큼(일) 지나면 리마인드 메일을 다시 보낸다.
      reminder-interval-days: 3
      cron: "0 30 9 * * *"
  opinion:
    # 회신 기한이 내일인 회신중 요청의 미회신 기관에 리마인드를 보내는 때(매일 9시).
    due-reminder-cron: "0 0 9 * * *"
  testplan:
    # 수행 종료일·테스트데이터 회신 기한이 내일인 기관 테스트에서 아직 결과·테스트데이터를 내지 않은 기관에 리마인드를 보내는 때(매일 9시).
    due-reminder-cron: "0 0 9 * * *"
  suspension:
    # 끝난 확정 일시중단을 완료로 바꾸는 주기(ms).
    completion-interval: 60000
    digest:
      # 전 영업일 취합. 전달 양식은 명세 미결이라 임시 양식이다(SuspensionDigestFormatter 빈을 바꿔 끼운다).
      cron: "0 0 16 * * MON-FRI"
      channels: ["~kftc-ops", "~kftc-control-room"]
      # 주말 말고 쉬는 날(예: 2026-12-25). 영업일 계산에 쓴다.
      holidays: []
      # 처음 확정되면 그 건(관련 업무, 조치 및 인수인계 사항)을 위 채널로 바로 보낸다(시연용).
      send-on-confirm: true

logging:
  level:
    com.connectlink: INFO
